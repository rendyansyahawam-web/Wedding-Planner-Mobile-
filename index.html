.timeline{position:relative}.timeline:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:#e4d8ec}.tl{position:relative;padding:0 0 14px 24px}.tl:before{content:"";position:absolute;left:1px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--p);box-shadow:0 0 0 4px var(--pl)}.tl b{font-size:11px;color:var(--p)}.tl strong{display:block;font-size:13px;margin:2px 0}.tl small{color:var(--muted);font-size:10px;line-height:1.45}

<main class="container" id="app">

      <div class="stat"><div class="stat-icon">✅</div><small>Progress</small><strong id="sumProgress">0%</strong></div>
    </div>
  </section>

  <section class="section"><div class="card">
    <div class="section-head"><h2>Wedding Progress</h2><span class="badge pending" id="autosaveBadge">AUTO-SAVE</span></div>
    <div class="progress"><i id="mainProgress" style="width:0%"></i></div><div class="progress-row"><span>Perencanaan</span><b id="progressLabel">0%</b><span>Hari H</span></div>
  </div></section>

  <section class="section"><div class="section-head"><h2>Wedding Menu</h2></div>
    <div class="menu-grid">
      <button class="menu" onclick="showPage('budget')"><div class="mi">💰</div><span>Budget</span></button>
      <button class="menu" onclick="showPage('savings')"><div class="mi">🏦</div><span>Tabungan</span></button>
      <button class="menu" onclick="showPage('timeline')"><div class="mi">📅</div><span>Timeline</span></button>
      <button class="menu" onclick="showPage('guests')"><div class="mi">👥</div><span>Tamu</span></button>
      <button class="menu" onclick="showPage('lamaran')"><div class="mi">💍</div><span>Lamaran</span></button>
      <button class="menu" onclick="showPage('seserahan')"><div class="mi">🎁</div><span>Seserahan</span></button>
      <button class="menu" onclick="showPage('theday')"><div class="mi">💒</div><span>The Day</span></button>
      <button class="menu" onclick="showPage('vendors')"><div class="mi">🏢</div><span>Vendor</span></button>
    </div>
  </section>

  <section class="section" id="homeTimeline"><div class="section-head"><h2>Timeline Wedding</h2><button onclick="showPage('timeline')">Kelola</button></div><div class="card" id="timelinePreview"></div></section>
  <section class="section"><div class="section-head"><h2>Task / Checklist</h2><button onclick="openModal('task')">+ Tambah</button></div><div class="card" id="taskList"></div></section>
  <section class="section"><div class="section-head"><h2>Vendor Utama</h2><button onclick="showPage('vendors')">Kelola</button></div><div class="card" id="vendorPreview"></div></section>
</main>

<div id="pageContainer" class="container hidden"></div>

function merge(base,src){if(!src||typeof src!=='object')return base;for(const k in src){if(src[k]&&typeof src[k]==='object'&&!Array.isArray(src[k])&&base[k])base[k]=merge(base[k],src[k]);else base[k]=src[k]}return base}

function saveTotalBudget(){const n=Math.max(0,num(v('totalBudget')));db.settings.totalBudget=n;save('Total budget diperbarui');closeModal();renderAll()}
function saveSettings(){db.settings={...db.settings,couple:v('couple'),date:v('date')};save();closeModal();renderHome()}
function saveTask(i){const x={title:v('title'),detail:v('detail'),done:v('done')==='true'};if(i===null)db.tasks.push(x);else db.tasks[i]=x;save();closeModal();renderAll()}
function saveSaving(i){const x={month:v('month'),gal:num(v('gal')),niram:num(v('niram')),status:v('status')};if(i===null)db.savings.push(x);else db.savings[i]=x;save();closeModal();renderAll()}
function saveExpense(i){const x={month:v('month'),name:v('name'),amount:num(v('amount')),pic:v('pic'),date:v('date')};if(i===null)db.expenses.push(x);else db.expenses[i]=x;save();closeModal();renderAll()}
function saveVendorPayment(i){const x={name:v('name'),bill:num(v('bill')),dp:num(v('dp')),installment:num(v('installment')),paid:num(v('paid')),status:v('status')};if(i===null)db.vendorPayments.push(x);else db.vendorPayments[i]=x;save();closeModal();renderAll()}
function saveTimeline(i){const x={month:v('month'),title:v('title'),detail:v('detail')};if(i===null)db.timeline.push(x);else db.timeline[i]=x;save();closeModal();renderAll()}
function saveGuest(i){const x={side:v('side'),category:v('category'),name:v('name'),qty:num(v('qty'))};if(i===null)db.guests.push(x);else db.guests[i]=x;save();closeModal();renderAll()}
function saveLamaran(i){const x={category:v('category'),item:v('item'),qty:num(v('qty')),price:num(v('price')),status:v('status')};if(i===null)db.lamaran.push(x);else db.lamaran[i]=x;save();closeModal();renderAll()}
function saveSeserahan(i){const old=i===null?{}:db.seserahan[i];const x={group:v('group'),item:v('item'),done:old.done||false,estimate:num(v('estimate')),final:num(v('final')),store:v('store'),link:v('link'),note:v('note')};if(i===null)db.seserahan.push(x);else db.seserahan[i]=x;save();closeModal();renderAll()}
function saveCicil(i){const x={month:v('month'),item:v('item'),budget:num(v('budget')),paid:num(v('paid'))};if(i===null)db.cicil.push(x);else db.cicil[i]=x;save();closeModal();renderAll()}
function saveTheday(i){const x={section:v('section'),name:v('name'),price:num(v('price')),store:v('store')};if(i===null)db.theday.push(x);else db.theday[i]=x;save();closeModal();renderAll()}
function saveAfter(i){const x={name:v('name'),price:num(v('price'))};if(i===null)db.after.push(x);else db.after[i]=x;save();closeModal();renderAll()}
function saveMahar(i){db.prewedding.mahar[i]={...db.prewedding.mahar[i],name:v('name'),price:num(v('price')),status:v('status')};save();closeModal();renderAll()}
function saveContact(i,type){const x={name:v('name'),company:v('company'),pic:v('pic'),phone:v('phone'),link:v('link')};if(i===null)db.contacts[type].push(x);else db.contacts[type][i]=x;save();closeModal();renderAll()}

function resetData(){if(!confirm('Reset semua data ke data referensi? Data editan akan hilang.'))return;db=clone(defaultData);save('Data dikembalikan ke referensi');closeModal();renderAll()}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Wedding_Planner_Backup.json';a.click();URL.revokeObjectURL(a.href)}
function renderAll(){renderHome();const active=document.querySelector('.nav button.active');if(!document.getElementById('pageContainer').classList.contains('hidden')){const p=active?.id==='nBudget'?'budget':active?.id==='nTimeline'?'timeline':active?.id==='nGuest'?'guests':null;if(p)showPage(p)}}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function countdown(){const target=new Date(db.settings.date+'T00:00:00').getTime(),now=Date.now(),d=Math.max(0,target-now);cdD.textContent=Math.floor(d/86400000);cdH.textContent=Math.floor(d/3600000)%24;cdM.textContent=Math.floor(d/60000)%60;cdS.textContent=Math.floor(d/1000)%60}
renderHome();countdown();setInterval(countdown,1000);
</script>
</body>
</html>
