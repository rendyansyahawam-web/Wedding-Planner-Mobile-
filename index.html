:root{--p:#7652a8;--p2:#5b3c84;--pl:#f3edfa;--ink:#28232d;--muted:#8b8492;--line:#e8e1ed;--green:#58a96d;--red:#d85c68;--orange:#d99535;--white:#fff;--bg:#f7f5f9}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card,.stat,.menu{background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:0 7px 22px #56377812}.stat{padding:13px;position:relative}.stat.editable{cursor:pointer}.stat.editable:active{transform:scale(.99)}.stat-edit{position:absolute;right:11px;top:11px;width:28px;height:28px;border-radius:9px;background:var(--pl);color:var(--p);display:grid;place-items:center;font-size:13px}.stat-icon{width:36px;height:36px;background:var(--pl);border-radius:11px;display:grid;place-items:center;margin-bottom:8px}.stat small{font-size:10px;color:var(--muted)}.stat strong{display:block;font-size:16px;margin-top:3px}
.progress{height:8px;background:#eee9f1;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--p),#ad82d5);border-radius:99px;transition:.25s}.progress-row{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:7px}
.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.menu{padding:10px 3px;text-align:center}.menu .mi{width:38px;height:38px;border-radius:12px;background:var(--pl);display:grid;place-items:center;margin:auto;font-size:19px}.menu span{font-size:9px;display:block;margin-top:6px}
.card{padding:14px}.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0ecf2}.row:last-child{border-bottom:0}.grow{flex:1;min-width:0}.row b{font-size:12px}.row small{display:block;font-size:10px;color:var(--muted);margin-top:3px}.badge{font-size:8px;font-weight:800;padding:5px 7px;border-radius:8px;white-space:nowrap}.pending{background:#fff1dc;color:#b7751e}.done{background:#e8f7ed;color:#38844e}.danger{background:#fdecee;color:#b93f4e}.actions{display:flex;gap:5px}.mini{width:30px;height:30px;border-radius:9px;background:#f3eff5;color:var(--p);font-size:13px}.mini.del{color:var(--red)}
.timeline{position:relative}.timeline:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:#e4d8ec}.tl{position:relative;padding:0 0 14px 24px}.tl:before{content:"";position:absolute;left:1px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--p);box-shadow:0 0 0 4px var(--pl)}.tl b{font-size:11px;color:var(--p)}.tl strong{display:block;font-size:13px;margin:2px 0}.tl small{color:var(--muted);font-size:10px;line-height:1.45}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:690px;font-size:10px}.table th{background:#eadcf3;color:#4e365e}.table th,.table td{padding:8px 6px;border:1px solid var(--line);text-align:left}.table input,.table select{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px;background:#fff}.table .section-row td{background:#e7f2e0;font-weight:800}

.empty{text-align:center;color:var(--muted);font-size:11px;padding:18px}
.fab{position:fixed;right:18px;bottom:82px;width:54px;height:54px;border-radius:18px;background:var(--p);color:#fff;font-size:24px;box-shadow:0 10px 25px #7652a855;z-index:30}
.nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:#fffffff2;backdrop-filter:blur(15px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:25}.nav button{background:none;color:#918a98;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav button b{font-size:19px;font-weight:500}.nav button.active{color:var(--p);font-weight:800}

</header>

<main class="container" id="app">
  <section class="section" id="home">

    <div class="stats">
      <button class="stat editable" type="button" onclick="openModal('totalBudget')" aria-label="Edit Total Budget"><div class="stat-icon">💰</div><small>Total Budget</small><strong id="sumBudget">Rp 0</strong><span class="stat-edit">✎</span></button>
      <div class="stat"><div class="stat-icon">💳</div><small>Sudah Dibayar (Pengeluaran)</small><strong id="sumPaid">Rp 0</strong></div>
      <div class="stat"><div class="stat-icon">👥</div><small>Total Tamu</small><strong id="sumGuests">0</strong></div>
      <div class="stat"><div class="stat-icon">✅</div><small>Progress</small><strong id="sumProgress">0%</strong></div>
    </div>
  </section>

  <section class="section"><div class="card">
    <div class="section-head"><h2>Wedding Progress</h2><span class="badge pending" id="autosaveBadge">AUTO-SAVE</span></div>
    <div class="progress"><i id="mainProgress" style="width:0%"></i></div><div class="progress-row"><span>Perencanaan</span><b id="progressLabel">0%</b><span>Hari H</span></div>
  </div></section>

  <section class="section"><div class="section-head"><h2>Wedding Menu</h2></div>
    <div class="menu-grid">
      <button class="menu" onclick="showPage('budget')"><div class="mi">💰</div><span>Budget</span></button>
      <button class="menu" onclick="showPage('savings')"><div class="mi">🏦</div><span>Tabungan</span></button>
      <button class="menu" onclick="showPage('timeline')"><div class="mi">📅</div><span>Timeline</span></button>
      <button class="menu" onclick="showPage('guests')"><div class="mi">👥</div><span>Tamu</span></button>
      <button class="menu" onclick="showPage('lamaran')"><div class="mi">💍</div><span>Lamaran</span></button>
      <button class="menu" onclick="showPage('seserahan')"><div class="mi">🎁</div><span>Seserahan</span></button>
      <button class="menu" onclick="showPage('theday')"><div class="mi">💒</div><span>The Day</span></button>
      <button class="menu" onclick="showPage('vendors')"><div class="mi">🏢</div><span>Vendor</span></button>
    </div>
  </section>

  <section class="section" id="homeTimeline"><div class="section-head"><h2>Timeline Wedding</h2><button onclick="showPage('timeline')">Kelola</button></div><div class="card" id="timelinePreview"></div></section>
  <section class="section"><div class="section-head"><h2>Task / Checklist</h2><button onclick="openModal('task')">+ Tambah</button></div><div class="card" id="taskList"></div></section>
  <section class="section"><div class="section-head"><h2>Vendor Utama</h2><button onclick="showPage('vendors')">Kelola</button></div><div class="card" id="vendorPreview"></div></section>
</main>

<div id="pageContainer" class="container hidden"></div>

<button class="fab" onclick="openQuick()">＋</button>
<nav class="nav">
  <button id="nHome" class="active" onclick="showPage('home')"><b>⌂</b>Home</button>
  <button id="nBudget" onclick="showPage('budget')"><b>💰</b>Budget</button>
  <button id="nTimeline" onclick="showPage('timeline')"><b>📅</b>Timeline</button>
  <button id="nGuest" onclick="showPage('guests')"><b>👥</b>Tamu</button>
  <button id="nMore" onclick="openQuick()"><b>☰</b>Menu</button>
</nav>

<div class="toast" id="toast"></div>
